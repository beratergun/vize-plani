  }
  function guideHTML() {
    const G = [["Aktif hatırlama", "Kaynağı kapat; öğrendiğini belleğinden anlat ya da yaz, sonra kaynakla karşılaştır. Tekrar tekrar okumaktan daha etkilidir."], ["Aralıklı tekrar", "Aynı konuyu 1, 3, 7 ve 14 gün sonra kısa kısa tekrar et. Kartlar sekmesi bunu senin için zamanlar."], ["Feynman tekniği", "Konuyu hiç bilmeyen birine anlatır gibi yaz. Anlatırken takıldığın yer, eksik bilgin olan yerdir; oraya dön."], ["Çözümlü örnekten bağımsız çözüme", "Çözümlü bir örneği izle, kapat ve aynısını sıfırdan çöz. Takılırsan 10 dakika dene, sonra çözüme bak."], ["Karıştırarak çalışma", "Aynı konuda saatlerce kalma; farklı problem tiplerini karıştır. Sınavda hangi yöntemi seçeceğini ayırt etmeyi öğretir."], ["Pomodoro", "25 dakika odak, 5 dakika mola. Dört turdan sonra 15–20 dakika uzun mola ver. Telefonu uzağa koy."], ["Yanlış defteri", "Her yanlışın sebebini yaz (bilgi, işlem, dikkat). Tekrar eden hata türü, bir sonraki çalışmanın konusudur."], ["Sınav günü", "Yeni konu başlatma. Şemaları, formülleri ve yanlış defterini gözden geçir; kimliğini ve kalemini hazırla; erken uyu."]];
    return `<section class="card"><h3>Nasıl çalışılır? (kanıta dayalı teknikler)</h3><div style="display:grid;gap:8px;margin-top:10px">${G.map(g => `<details class="g"><summary>${esc(g[0])}</summary><div>${esc(g[1])}</div></details>`).join("")}</div></section>`;
  }

  const VIEWS = {bugun:vToday, geride:vLate, kartlar:vCards, yanlislar:vMist, notlar:vNotes, takvim:vCal, dersler:vCourses, sinavlar:vExams, kaynaklar:vRes, panel:() => `<div class="side" style="display:grid;gap:14px">${sideHTML()}</div>`};
  const tab = () => { const t = (location.hash || "").replace("#", ""); return VIEWS[t] ? t : "bugun"; };
  function render() {
    const t = tab(); document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.tab === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    const all = tasksAll.filter(x => !x.x), dn = all.filter(x => isDone(x.id)); $("#sub").textContent = `${fmt(DATA.start)} – ${fmt(DATA.end)} · %${all.length ? Math.round(100 * dn.length / all.length) : 0} tamamlandı · ${dur(totalSec())}`;
    const open = new Set([...document.querySelectorAll(".task details[open]")].map(x => x.closest(".task").dataset.id));
    $("#view").innerHTML = VIEWS[t](); $("#side").innerHTML = sideHTML(); updateBadgeCount(); renderDock();
    open.forEach(id => { const a = document.querySelector('.task[data-id="' + id + '"]'); if (a) a.querySelector("details").open = true; });
  }
  function softRender() { const a = document.activeElement; if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return; const y = window.scrollY; render(); window.scrollTo(0, y); }
  function renderDock() {
    const el = $("#dock");
    if (MOCK) { el.classList.add("on"); el.innerHTML = `<div class="in"><span class="t" id="dockM">${mmss(Math.round((MOCK.end - Date.now()) / 1000))}</span><span class="nm">Deneme: ${esc(SHORT[MOCK.c] || MOCK.c)} · bitince yanlışlarını deftere yaz</span><button data-act="mock-end">Bitir</button></div>`; return; }
    if (RUN) { const t = taskById(RUN.id); el.classList.add("on"); el.innerHTML = `<div class="in"><span class="t" id="dockT">${live(elapsed())}</span><span class="nm">${esc(t ? (SHORT[t.c] || t.c) + " · " + (t.k === "T" ? "tekrar" : t.ti) : "")}${P.pomo.on ? ` · pomodoro kalan <span id="dockP">${mmss(P.pomo.work * 60 - elapsed())}</span>` : ""}</span><button data-act="timer" data-id="${esc(RUN.id)}" aria-label="Duraklat">⏸ Dur</button><button data-act="st" data-v="d" data-id="${esc(RUN.id)}">✓ Bitir</button><span class="hint" id="dockH" hidden></span></div>`; }
    else if (BRK) { el.classList.add("on"); el.innerHTML = `<div class="in"><span class="t" id="dockB">${mmss(Math.round((BRK.end - Date.now()) / 1000))}</span><span class="nm">Mola: su iç, ekrandan uzaklaş.</span><button data-act="skipbrk">Molayı atla</button></div>`; }
    else { el.classList.remove("on"); el.innerHTML = ""; document.title = "Vize Planı Takibi"; }
  }
  function pomoDone() { const id = RUN.id; stopTimer(); S.pomo[today] = {m:pomoToday() + 1, t:Date.now()}; BRK = {end:Date.now() + P.pomo.brk * 60000, id}; saveBrk(); persist(); notify("Pomodoro bitti", P.pomo.brk + " dakika mola ver"); checkBadges(); render(); }
  function breakDone() { BRK = null; saveBrk(); notify("Mola bitti", "Devam edelim"); render(); }
  let tick = 0, fired = {}; try { fired = JSON.parse(localStorage.getItem(FIREKEY) || "{}"); } catch (e) {}
  function reminders() {
    if (!P.rem.on || today < DATA.start || today > DATA.end) return; const d = byDate[today]; if (!d) return; const hm = nowHM(), st = dayStats(d), pend = st.n - st.d;
    const slot = (k, at, fn) => { const key = today + k; if (fired[key] || hm < at || hm > addMin(at, 120)) return; fired[key] = 1; try { localStorage.setItem(FIREKEY, JSON.stringify(fired)); } catch (e) {} fn(); };
    slot("am", P.rem.am, () => { if (pend > 0) notify("Günaydın", `Bugün ${st.n} zorunlu görev (≈${hrs(st.m)} saat) var. İlk iş: ${(d.t.find(t => !t.x && t.k !== "T") || {ti:"plan"}).ti}`); });
    slot("pm", P.rem.pm, () => { if (pend > 0) notify("Akşam kontrolü", `${pend} zorunlu görev kaldı (≈${hrs(st.m - st.dm)} saat). En az en kısa birini bitir.`); });
  }
  const addMin = (hm, m) => { const [h, mi] = hm.split(":").map(Number), t = h * 60 + mi + m; return pad(Math.min(23, Math.floor(t / 60))) + ":" + pad(t % 60 > 59 ? 59 : t % 60); };
  setInterval(() => {
    tick++; mockTick();
    if (RUN) { const e = elapsed(), tot = timeOf(RUN.id), t = taskById(RUN.id);
      const dt = $("#dockT"); if (dt) dt.textContent = live(e); const ft = $("#fcT"); if (ft) ft.textContent = live(e); document.title = "⏱ " + live(e) + " · Vize Planı";
      const left = mmss(P.pomo.work * 60 - e); const dp = $("#dockP"); if (dp) dp.textContent = left; const fp = $("#fcP"); if (fp) fp.textContent = "Pomodoro kalan: " + left;
      document.querySelectorAll('[data-live="' + RUN.id + '"]').forEach(n => n.textContent = "● " + live(tot));
      document.querySelectorAll('[data-bar="' + RUN.id + '"]').forEach(n => n.style.width = (t && t.m ? Math.min(100, Math.round(tot / 60 / t.m * 100)) : 0) + "%");
      const h = $("#dockH"); if (h && !P.pomo.on) { const blk = Math.floor(e / 1500); if (blk >= 1 && e % 1500 < 600) { h.hidden = false; h.textContent = blk * 25 + " dk doldu. 5 dakika mola ver, sonra devam et."; } else h.hidden = true; }
      if (P.pomo.on && e >= P.pomo.work * 60) pomoDone();
    } else if (BRK) { const left = Math.round((BRK.end - Date.now()) / 1000); const b = $("#dockB"); if (b) b.textContent = mmss(left); const b2 = $("#brkT"); if (b2) b2.textContent = mmss(left); if (left <= 0) breakDone(); }
    if (tick % 20 === 0) reminders();
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderDock(); softRender(); reminders(); } });

  let resetArmed = false;
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
    if (a === "st") { const id = el.dataset.id, v = el.dataset.v, cur = S.task[id], t = taskById(id), before = points(), lb = level(before).i, wasFull = dayFull(byDate[sel]); if (RUN && RUN.id === id && v === "d") stopTimer(); if (cur && cur.s === v) delete S.task[id]; else { S.task[id] = {s:v, t:Date.now()}; if (v === "d" && t && t.date < today && !S.badges.back) { S.badges.back = {t:Date.now()}; toast("Yeni rozet: Geri dönüş", 4200); } } persist(); render(); if (v === "d" && (!cur || cur.s !== "d")) reward(before, lb, el, wasFull); }
    else if (a === "timer") { const id = el.dataset.id; if (RUN && RUN.id === id) stopTimer(); else startTimer(id); render(); }
    else if (a === "skipbrk") { BRK = null; saveBrk(); render(); }
    else if (a === "alldone") { const before = points(), lb = level(before).i; byDate[sel].t.filter(x => !x.x && !isDone(x.id)).forEach(x => { S.task[x.id] = {s:"d", t:Date.now()}; }); if (RUN) stopTimer(); persist(); render(); reward(before, lb, el, false); }
    else if (a === "day") { sel = el.dataset.d; render(); window.scrollTo({top:0}); }
    else if (a === "open") { sel = el.dataset.d; location.hash = "#bugun"; render(); window.scrollTo({top:0}); }
    else if (a === "today") { sel = clampDay(today); render(); window.scrollTo({top:0}); }
    else if (a === "quote") { qi++; render(); }
    else if (a === "pomo-set") { P.pomo.work = +el.dataset.w; P.pomo.brk = +el.dataset.b; savePrefs(); render(); }
    else if (a === "ai-mode") { aiState(el.dataset.id).mode = el.dataset.v; softRender(); const o = document.querySelector('.task[data-id="' + el.dataset.id + '"] details'); if (o) o.open = true; }
    else if (a === "ai-lv") { aiState(el.dataset.id).lv = el.dataset.v; softRender(); }
    else if (a === "ai-run") runAI(el.dataset.id);
    else if (a === "ai-stop") { const st = aiState(el.dataset.id); try { st.ctl && st.ctl.abort(); } catch (x) {} }
    else if (a === "copycode") { const box = $("#xcode"); box.value = makeCode(); box.select(); try { navigator.clipboard.writeText(box.value).then(() => { el.textContent = "Kopyalandı ✓"; }, () => { el.textContent = "Metni seçtim, elle kopyala"; }); } catch (x) { el.textContent = "Metni seçtim, elle kopyala"; } }
    else if (a === "importcode") { try { const o = JSON.parse(decodeURIComponent(escape(atob($("#xin").value.trim())))); if (!o || o.v !== 2) throw 0; mergeInto(S, o); persist(); render(); const m = $("#xmsg"); if (m) m.textContent = "Birleştirildi ✓"; } catch (x) { const m = $("#xmsg"); if (m) m.textContent = "Kod okunamadı. Tüm kodu yapıştırdığından emin ol."; } }
    else if (a === "card-show") { CS.show = true; render(); }
    else if (a === "card-ans") { cardAnswer(el.dataset.k, el.dataset.v === "1"); }
    else if (a === "card-ai") cardAI(el.dataset.k);
    else if (a === "mist-add") mistAdd();
    else if (a === "seen") { try { localStorage.setItem("vizeplan.seen", "1"); } catch (x) {} render(); }
    else if (a === "q-show") { const k = el.dataset.k; QOPEN[k] = !QOPEN[k]; const id = k.split(":")[0]; render(); const o = document.querySelector('.task[data-id="' + id + '"] details'); if (o) o.open = true; }
    else if (a === "q-wrong") { const t = taskById(el.dataset.id), q = t && t.qs && t.qs[+el.dataset.i]; if (q) { const id = "m" + Date.now().toString(36); S.mist[id] = {c:t.c, top:"[" + t.ti + "] " + q[0], why:WHY[0], note:"Örnek soruda yanlış yaptım.", fix:q[1], d:today, r3:0, r7:0, t:Date.now()}; persist(); checkBadges(); toast("Yanlış defterine eklendi · +5 puan"); } }
    else if (a === "mist-r") { const m = S.mist[el.dataset.id]; if (m) { S.mist[el.dataset.id] = Object.assign({}, m, {[el.dataset.v]:1, t:Date.now()}); persist(); render(); } }
    else if (a === "mist-del") { S.mist[el.dataset.id] = {del:1, t:Date.now()}; persist(); render(); }
    else if (a === "mock-start") { const c = $("#mk-c").value, m = +$("#mk-m").value; if (RUN) stopTimer(); MOCK = {start:Date.now(), end:Date.now() + m * 60000, c, m}; saveMock(); render(); }
    else if (a === "mock-end") mockEnd();
    else if (a === "coach") runCoach();
    else if (a === "ai-save") { const id = el.dataset.id, st = aiState(id), md = AIMODES.find(x => x[0] === st.mode) || AIMODES[0], cur = (S.mynotes[id] && S.mynotes[id].v) || ""; if (st.text) { S.mynotes[id] = {v:cur + (cur ? "\n\n" : "") + "— Claude (" + md[1] + ") —\n" + st.text, t:Date.now()}; persist(); toast("Notlarına eklendi"); softRender(); } }
    else if (a === "reset") { if (!resetArmed) { resetArmed = true; el.textContent = "Emin misin? Tekrar dokun"; el.classList.remove("ghost"); } else { if (RUN) { RUN = null; saveRun(); } S.task = {}; S.time = {}; S.notes = {}; S.con = {}; S.badges = {}; S.pomo = {}; S.cards = {}; S.mist = {}; S.mynotes = {}; S.grades = {}; S.mocks = {}; S.reset = Date.now(); resetArmed = false; persist(); render(); } }
  });
  document.addEventListener("change", e => {
    const el = e.target, a = el.dataset && el.dataset.act; if (!a) return;
    if (a === "con") { const before = points(), lb = level(before).i; if (el.checked) S.con[el.dataset.k] = {s:1, t:Date.now()}; else S.con[el.dataset.k] = {s:0, t:Date.now()}; persist(); softRender(); if (el.checked) reward(before, lb, null, true); }
    else if (a === "pomo-on") { P.pomo.on = el.checked; savePrefs(); render(); }
    else if (a === "rem-on") { P.rem.on = el.checked; savePrefs(); }
    else if (a === "rem-am") { if (el.value) { P.rem.am = el.value; savePrefs(); } }
    else if (a === "rem-pm") { if (el.value) { P.rem.pm = el.value; savePrefs(); } }
    else if (a === "rem-notif") { if (el.checked) { try { Notification.requestPermission().then(p => { P.rem.notif = p === "granted"; savePrefs(); toast(p === "granted" ? "Bildirimler açık" : "Bildirim izni verilmedi"); render(); }); } catch (x) { P.rem.notif = false; el.checked = false; toast("Bu tarayıcıda bildirim desteklenmiyor"); } } else { P.rem.notif = false; savePrefs(); } }
  });
  let nt = 0; document.addEventListener("input", e => { const el = e.target; if (!el.dataset) return; if (el.dataset.act === "note") { S.notes[el.dataset.id] = {v:el.value, t:Date.now()}; clearTimeout(nt); nt = setTimeout(() => { persist(); checkBadges(); }, 700); } else if (el.dataset.act === "ai-q") aiState(el.dataset.id).q = el.value; else inputNew(el); });
  $("#theme").addEventListener("click", () => { const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!S.theme && matchMedia("(prefers-color-scheme: dark)").matches); S.theme = dark ? "light" : "dark"; applyTheme(); persist(); });
  window.addEventListener("hashchange", () => { render(); window.scrollTo({top:0}); });
  window.addEventListener("pagehide", () => { saveLocal(); });
  checkBadges(true); setSync("local"); render(); initCloud(); setTimeout(reminders, 1500);
})();
</script>
</body></html>
