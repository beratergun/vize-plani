    const wkDays = days.filter(x => x.d >= wk[0] && x.d <= wk[1]);
    let h = "";
    if (today < DATA.start) h += `<div class="warnband">Plan ${fmt(DATA.start)} günü başlıyor (${diff(today, DATA.start)} gün sonra). Bugün boşsa 1. günün ilk iki görevini şimdiden başlatabilirsin.</div>`;
    else if (today > DATA.end) h += `<div class="warnband">Plan ${fmt(DATA.end)} tarihinde bitti. Eski günlere Takvim sekmesinden bakabilirsin.</div>`;
    h += `<section class="card"><div class="strip" role="group" aria-label="Haftanın günleri">${wkDays.map(x => { const s = dayStats(x); return `<button data-act="day" data-d="${x.d}" class="${x.d === today ? "t" : ""}" ${x.d === d.d ? 'aria-current="date"' : ""}><b>${utc(x.d).getUTCDate()}</b><span>${esc(x.wd.slice(0, 3))}</span><span>${s.n ? Math.round(100 * s.d / s.n) : 0}%</span></button>`; }).join("")}</div></section>`;
    const evs = evOn(d.d).filter(e => !e.e || e.d === d.d);
    h += `<section class="card hero"><div class="sub"><span>${esc(d.wd)} · ${esc(d.ph)}</span>${d.d === today ? '<span class="today-tag">BUGÜN</span>' : ""}</div><h2>${dt.getUTCDate()} ${MON[dt.getUTCMonth()]}</h2>`;
    evs.forEach(e => { h += `<div class="exam-band">▲ ${esc(e.t)}${e.tm ? " · " + e.tm[0] + "–" + e.tm[1] : ""}</div>`; });
    h += `<div class="goal">${esc(d.g)}</div><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="nums"><span>${st.d}/${st.n} zorunlu görev</span><span>${st.dm}/${st.m} dk</span>${st.s ? `<span>${st.s} yapmadım</span>` : ""}<span>%${pct}</span></div></section>`;
    h += adviceHTML(d);
    const core = d.t.filter(t => !t.x), ext = d.t.filter(t => t.x);
    h += `<div class="sec"><h3>Zorunlu</h3><span>≈ ${(st.m / 60).toFixed(1).replace(".", ",")} saat</span></div>${core.map(taskHTML).join("")}${core.some(x => !isDone(x.id)) ? `<button class="btn ghost" data-act="alldone">Günün tüm zorunlularını yaptım</button>` : ""}`;
    if (ext.length) h += `<div class="sec"><h3>İstersen</h3><span>enerjin varsa · ${ext.reduce((a, t) => a + t.m, 0)} dk</span></div>${ext.map(taskHTML).join("")}`;
    const i = days.findIndex(x => x.d === d.d);
    h += `<div class="bar"><button class="btn ghost" data-act="day" data-d="${i > 0 ? days[i - 1].d : d.d}" ${i === 0 ? "disabled" : ""}>← Önceki gün</button><button class="btn ghost" data-act="today">Bugüne git</button><button class="btn ghost" data-act="day" data-d="${i < days.length - 1 ? days[i + 1].d : d.d}" ${i === days.length - 1 ? "disabled" : ""}>Sonraki gün →</button></div>`;
    h += `<p class="note">Yetişemediysen ertesi güne yığma: yalnızca zorunlu satırları bitir. Hata yaptığın her soruyu sebebiyle not al.</p>`;
    return h;
  }
  function vCal() {
    return DATA.weeks.map(w => { const wd = days.filter(x => x.d >= w[0] && x.d <= w[1]);
      return `<section class="week"><h3>${esc(w[2])} <span class="note">${fmt(w[0])} – ${fmt(w[1])}</span></h3><div class="days">${wd.map(x => { const s = dayStats(x), ev = evOn(x.d); const mc = mainCourse(x);
        return `<button class="day${x.d === today ? " t" : ""}" data-act="open" data-d="${x.d}" style="--cc:var(--c-${mc})"><b>${utc(x.d).getUTCDate()} ${MON[utc(x.d).getUTCMonth()].slice(0, 3)}</b><span>${esc(x.wd.slice(0, 3))} · ${esc(SHORT[mc] || mc)}</span><span>%${s.n ? Math.round(100 * s.d / s.n) : 0} · ${(x.cm / 60).toFixed(1).replace(".", ",")} sa</span>${ev.map(e => `<span class="ev">▲ ${esc(e.t.split(" ").slice(0, 2).join(" "))}</span>`).join("")}</button>`; }).join("")}</div></section>`; }).join("");
  }
  function vCourses() {
    const h = Object.keys(DATA.courses).map(c => { const m = DATA.courses[c]; const ts = tasksAll.filter(t => t.c === c && !t.x), dn = ts.filter(t => isDone(t.id)); const pct = ts.length ? Math.round(100 * dn.length / ts.length) : 0;
      const nx = DATA.evals.filter(e => e.c === c && (e.e || e.d) >= today).sort((a, b) => a.d < b.d ? -1 : 1)[0];
      const tops = DATA.topics.filter(t => t.c === c).map(tp => { const tk = tasksAll.find(t => t.b === tp.id); return `<li>${tk && isDone(tk.id) ? '<span class="ok">✓</span>' : '<span class="nd">○</span>'}<span>${esc(tp.t)}${tp.u && DATA.links[tp.u] ? ` <a href="${esc(DATA.links[tp.u][1])}" target="_blank" rel="noopener noreferrer">kaynak</a>` : ""}${tk ? ` <span class="note">· ${fmt(tk.date)}</span>` : ""}</span></li>`; }).join("");
      return `<section class="card course" style="--cc:var(--c-${c});border-top:6px solid var(--cc)"><h3>${esc(c)} <span class="note">${esc(m.n)}</span></h3><div class="dots" aria-label="Zorluk ${m.diff}/5">${"●".repeat(m.diff)}${"○".repeat(5 - m.diff)}</div><p class="note">${esc(m.meth)}</p><div class="meter"><i style="width:${pct}%"></i></div><div class="nums"><span>${dn.length}/${ts.length} zorunlu görev</span><span>%${pct}</span></div>${nx ? `<p><b>Sıradaki:</b> ${esc(nx.t)} · ${diff(today, nx.d) >= 0 ? diff(today, nx.d) + " gün" : "geçti"}</p>` : ""}${tops ? `<details><summary><span class="more">konu listesi</span></summary><ul class="topics">${tops}</ul></details>` : ""}</section>`; }).join("");
    return `<div class="grid">${h}</div><p class="note">Yüzde yalnızca görev tamamlanmasını gösterir; konuyu gerçekten öğrenip öğrenmediğini kendi test sonucun belirler.</p>`;
  }
  function vExams() {
    const ev = DATA.evals.slice().sort((a, b) => a.d < b.d ? -1 : 1);
    return ev.map(e => { const dd = diff(today, e.d), st = STT[e.s] || ["", ""]; const rng = fmt(e.d) + (e.e ? " – " + fmt(e.e) : "") + (e.tm ? " · " + e.tm[0] + "–" + e.tm[1] : "");
      return `<section class="card exam" style="border-left:6px solid var(--c-${e.c})"><div class="row1"><span class="chip" style="--cc:var(--c-${e.c})">${esc(SHORT[e.c] || e.c)}</span><span class="st ${st[1]}">${st[0]}</span></div><h3>${esc(e.t)}</h3><div class="count">${(e.e || e.d) < today ? "geçti" : dd <= 0 ? "bugün" : dd}<small> ${(e.e || e.d) < today || dd <= 0 ? "" : "gün kaldı"} · ${rng}</small></div><p class="note">${esc(e.n)}</p><label class="note" for="n-${esc(e.id)}">Notum (saat, kapsam, duyuru):</label><textarea id="n-${esc(e.id)}" data-act="note" data-id="${esc(e.id)}">${esc(S.notes[e.id] || "")}</textarea></section>`; }).join("");
  }
  function vRes() {
    let h = `<section class="card"><p class="note" style="margin:0">Bağlantılar 29 Ekim 2026'da açılış testinden geçti; OpenStax bölüm numaraları sayfa özetleriyle eşleştirildi. Khan Academy sayfaları bot korumalı olduğu için içerik başlığı otomatik doğrulanamadı, açılmazsa OpenStax'ı kullan. YouTube bağlantıları arama sayfasıdır, videoyu sen seçersin.</p></section>`;
    Object.keys(DATA.home).forEach(c => { const ls = DATA.home[c].map(id => linkHTML("", id)).join(""); h += `<section class="card"><h3 style="${DATA.courses[c] ? "color:var(--c-" + c + ")" : ""}">${esc(c === "ARAÇLAR" ? "Araçlar" : c + " · " + (DATA.courses[c] ? DATA.courses[c].n : ""))}</h3><ul class="links" style="margin-top:10px">${ls}</ul></section>`; });
    h += `<section class="card xfer"><h3>Cihazlar arası aktarım</h3><p class="note">İlerleme ${cloud ? "hesabında saklanıyor, iki cihazda da aynı hesapla açınca otomatik eşleşir" : "bu tarayıcıda saklanıyor"}. Eşleşmezse kodu bir cihazdan kopyalayıp diğerine yapıştır.</p><button class="btn ghost" data-act="copycode">Kodu kopyala</button><textarea id="xcode" readonly aria-label="İlerleme kodu"></textarea><label class="note" for="xin">Başka cihazdan gelen kodu buraya yapıştır:</label><textarea id="xin"></textarea><button class="btn" data-act="importcode">İçe aktar</button> <span class="note" id="xmsg"></span></section><section class="card"><h3>Sıfırla</h3><button class="btn ghost" data-act="reset">İlerlemeyi sıfırla</button></section>`;
    return h;
  }
  const TIPS = {
    BIO110: "Okumak öğrenmek değildir: her alt başlıktan sonra ekranı kapat, 3 cümleyle bellekten anlat, sonra şemayı boş kağıda çiz.",
    CMPE371: "Çözümlü örneği izledikten sonra kapat ve sıfırdan çöz. Takılırsan 10 dakika dene, sonra çözüme bak ve yanlış sebebini yaz.",
    CMPE327: "Her otomat için en az 3 test string dene. Önce geçiş tablosunu doldur, sonra çiz.",
    CMPE421: "Algoritmayı kağıtta adım adım yürüt: açık liste, kapalı liste ve maliyetleri her adımda yaz.",
    CMPE453: "Register adlarını bellekten yaz; her bit işlemini 8 bitlik bir örnekte elle uygula, sonra kodu oku.",
    CMPE499: "Rapor ve videoyu tek oturuşta bitirmeye çalışma. Her gün küçük bir parça ilerlet, son güne bırakma.",
    GENEL: "Önce zorunlu satırları bitir, ekstralar enerjin varsa."};
  function examPassed(t) { const ev = DATA.evals.filter(e => e.c === t.c && e.d >= t.date).sort((x, y) => x.d < y.d ? -1 : 1)[0]; return !!ev && (ev.e || ev.d) < today; }
  // Geride sayılır: vadesi geçmiş, yapılmamış zorunlu görev. Sınavı geçmiş hazırlık (konu/deneme/tekrar) ve 3 günden eski tekrar satırları sayılmaz.
  function lateTasks() { return tasksAll.filter(t => !t.x && t.date < today && !isDone(t.id) && !(["L", "P", "T", "V"].includes(t.k) && examPassed(t)) && !(t.k === "T" && diff(t.date, today) > 3)); }
  function nextExam(c) { return DATA.evals.filter(e => e.c === c && (e.e || e.d) >= today).sort((a, b) => a.d < b.d ? -1 : 1)[0]; }
  const hrs = m => (m / 60).toFixed(1).replace(".", ",");
  function adviceHTML(d) {
    const L = [], late = lateTasks(), mc = mainCourse(d), ex = nextExam(mc);
    if (late.length) {
      const top = (late.filter(x => x.k !== "T").length ? late.filter(x => x.k !== "T") : late).slice().sort((a, b) => (b.cr - a.cr) || (((nextExam(a.c) || {d:"9999"}).d < (nextExam(b.c) || {d:"9999"}).d) ? -1 : 1)).slice(0, 3);
      L.push(`<li><b>Geride ${late.length} zorunlu görev var (≈${hrs(late.reduce((a, t) => a + t.m, 0))} saat).</b> Önce sınavı en yakın dersten başla: ${top.map(t => esc((SHORT[t.c] || t.c) + " · " + (t.k === "T" ? "tekrar" : t.ti))).join("; ")}. <a href="#geride">Hepsini gör</a></li>`);
    }
    if (ex) {
      const dd = diff(today, ex.d), rem = tasksAll.filter(t => t.c === mc && !t.x && t.date <= ex.d && !isDone(t.id) && t.k !== "T").reduce((a, t) => a + t.m, 0);
      if (dd >= 0 && dd <= 3) L.push(`<li><b>${esc(ex.t)} ${dd === 0 ? "bugün" : dd + " gün sonra"}.</b> Yeni konu başlatma; yanlış defterini, şemaları ve formülleri tekrar et, erken uyu.</li>`);
      else if (dd > 3) L.push(`<li><b>${esc(SHORT[mc] || mc)} için ${esc(ex.t)}'e ${dd} gün var.</b> Kalan zorunlu iş ≈ ${hrs(rem)} saat, günde ≈ ${hrs(rem / dd)} saat yeter.</li>`);
    }
    let streak = 0; for (let i = days.findIndex(x => x.d === today) - 1; i >= 0; i--) { const s = dayStats(days[i]); if (s.n && s.d === s.n) streak++; else break; }
    if (streak >= 2) L.push(`<li><b>${streak} gün üst üste zorunlu görevleri bitirdin.</b> Bugünü de kaçırma.</li>`);
    L.push(`<li>${esc(TIPS[mc] || TIPS.GENEL)}</li>`);
    return `<section class="card advice"><h3>Bugünün önerisi</h3><ul>${L.join("")}</ul></section>`;
  }
  function vLate() {
    const late = lateTasks().sort((a, b) => a.date < b.date ? -1 : 1);
    if (!late.length) return `<section class="card empty">Geride kalan zorunlu görev yok. ${today < DATA.start ? "Plan henüz başlamadı." : "Böyle devam."}</section>`;
    return `<section class="card"><h3>Geride kalanlar</h3><p class="note">Toplam ${late.length} görev, ≈ ${hrs(late.reduce((a, t) => a + t.m, 0))} saat. Sınavı en yakın dersten başla, her gün bugünün zorunlularına 1 saat ekle. Yaptıklarını işaretle.</p></section>` + late.map(t => `<div class="sec"><span>${fmt(t.date)} · ${esc(t.date ? byDate[t.date].wd : "")}</span></div>` + taskHTML(t)).join("");
  }
  function makeCode() { try { return btoa(unescape(encodeURIComponent(JSON.stringify({v:1, d:Object.keys(S.done), s:Object.keys(S.skip), n:S.notes, ts:S.ts})))); } catch (e) { return ""; } }
  const VIEWS = {bugun:vToday, geride:vLate, takvim:vCal, dersler:vCourses, sinavlar:vExams, kaynaklar:vRes};
  function tab() { const t = (location.hash || "").replace("#", ""); return VIEWS[t] ? t : "bugun"; }
  function render() {
    const t = tab(); document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.tab === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    const all = tasksAll.filter(x => !x.x), dn = all.filter(x => isDone(x.id)); $("#sub").textContent = `${fmt(DATA.start)} – ${fmt(DATA.end)} · %${all.length ? Math.round(100 * dn.length / all.length) : 0} tamamlandı`;
    const open = new Set([...document.querySelectorAll(".task details[open]")].map(x => x.closest(".task").dataset.id));
    $("#view").innerHTML = VIEWS[t]();
    open.forEach(id => { const a = document.querySelector('.task[data-id="' + id + '"]'); if (a) a.querySelector("details").open = true; });
  }
  let resetArmed = false;
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
    if (a === "st") { const id = el.dataset.id; if (el.dataset.v === "done") { if (S.done[id]) delete S.done[id]; else { S.done[id] = Date.now(); delete S.skip[id]; } } else { if (S.skip[id]) delete S.skip[id]; else { S.skip[id] = Date.now(); delete S.done[id]; } } persist(); render(); }
    else if (a === "alldone") { byDate[S.sel].t.filter(x => !x.x && !isDone(x.id)).forEach(x => { S.done[x.id] = Date.now(); delete S.skip[x.id]; }); persist(); render(); }
    else if (a === "copycode") { const box = $("#xcode"); box.value = makeCode(); box.select(); try { navigator.clipboard.writeText(box.value).then(() => { el.textContent = "Kopyalandı ✓"; }, () => { el.textContent = "Metni seçtim, elle kopyala"; }); } catch (e) { el.textContent = "Metni seçtim, elle kopyala"; } }
    else if (a === "importcode") { const msg = $("#xmsg"); try { const o = JSON.parse(decodeURIComponent(escape(atob($("#xin").value.trim())))); if (!o || o.v !== 1) throw 0; S.done = {}; S.skip = {}; (o.d || []).forEach(i => S.done[i] = 1); (o.s || []).forEach(i => S.skip[i] = 1); S.notes = o.n || {}; persist(); render(); const m2 = $("#xmsg"); if (m2) m2.textContent = "İçe aktarıldı ✓"; } catch (e) { msg.textContent = "Kod okunamadı. Tüm kodu yapıştırdığından emin ol."; } }
    else if (a === "day") { S.sel = el.dataset.d; persist(); render(); window.scrollTo({top:0}); }
    else if (a === "open") { S.sel = el.dataset.d; persist(); location.hash = "#bugun"; render(); window.scrollTo({top:0}); }
    else if (a === "today") { S.sel = clampDay(today); persist(); render(); window.scrollTo({top:0}); }
    else if (a === "reset") { if (!resetArmed) { resetArmed = true; el.textContent = "Emin misin? Tekrar dokun"; el.classList.remove("ghost"); } else { S.done = {}; S.skip = {}; S.notes = {}; resetArmed = false; persist(); render(); } }
  });
  let nt = 0; document.addEventListener("input", e => { const el = e.target; if (el.dataset && el.dataset.act === "note") { S.notes[el.dataset.id] = el.value; clearTimeout(nt); nt = setTimeout(persist, 600); } });
  $("#theme").addEventListener("click", () => { const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!S.theme && matchMedia("(prefers-color-scheme: dark)").matches); S.theme = dark ? "light" : "dark"; applyTheme(); persist(); });
  window.addEventListener("hashchange", () => { render(); window.scrollTo({top:0}); });
  render(); initCloud();
})();
</script>
</body></html>
